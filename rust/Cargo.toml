[package]
name = "rainbowminer"
version = "5.0.4-1"
edition = "2021"
description = "RainbowMiner - multi-algorithm, multi-pool, profit-switching mining manager (Rust port)"
license = "GPL-3.0-only"
readme = "README.md"
publish = false

[[bin]]
name = "rainbowminer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
crossterm = "0.28"
ctrlc = { version = "3", features = ["termination"] }
flate2 = "1"
hex = "0.4"
hmac = "0.12"
libloading = "0.8"
indexmap = { version = "2", features = ["serde"] }
md-5 = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sysinfo = { version = "0.30", default-features = false }
tar = "0.4"
tiny_http = "0.12"
ureq = { version = "2", features = ["json", "socks-proxy"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
